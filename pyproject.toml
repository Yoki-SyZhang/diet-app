[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests/backend"]
addopts = ["--import-mode=importlib", "-m", "not llm_live"]
markers = [
    "llm_live: 真实调用 DashScope,产生费用/依赖网络,默认不跑;用 `pytest -m llm_live` 显式触发",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend/app", "backend/scripts"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
